name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: playlist-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update and publish with safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            # Regenerate from the CURRENT remote snapshot on each attempt.
            # No force-push and no merge of conflicting generated files.
            git fetch origin main
            git checkout -B main origin/main
            python iptv_generator.py
            git add playlist.m3u working_links.json update_report.txt
            if git diff --cached --quiet; then
              echo 'No changes.'
              exit 0
            fi
            count=$(grep -c '^#EXTINF:' playlist.m3u || true)
            git commit -m "Update playlist (${count:-0} channels)"
            if git push origin HEAD:main; then
              echo 'Push successful.'
              exit 0
            fi
            echo 'Remote changed during update; regenerating from latest main.'
          done
          echo 'Push failed after 3 attempts.' >&2
          exit 1
