name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'source_playlist.m3u'

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests urllib3

      - name: Run updater
        env:
          INPUT_PLAYLIST:  source_playlist.m3u
          OUTPUT_PLAYLIST: playlist.m3u
          MAX_WORKERS:     '50'
          TIMEOUT_HTTP:    '6'
          TIMEOUT_MANIFEST: '8'
          TIMEOUT_SEGMENT: '8'
          MIN_SEGMENT_BYTES: '2048'
          REPLACE_DEAD:    'true'
        run: python iptv_generator.py

      - name: Show summary
        if: always()
        run: |
          echo "=== playlist.m3u ==="
          grep -c '^#EXTINF' playlist.m3u || true
          echo ""
          echo "=== Report (first 60 lines) ==="
          head -60 update_report.txt || true

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u working_links.json update_report.txt
          if git diff --staged --quiet; then
            echo "No changes."
          else
            CNT=$(grep -c '^#EXTINF' playlist.m3u || echo 0)
            git commit -m "🤖 Update playlist ($CNT ch) — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
